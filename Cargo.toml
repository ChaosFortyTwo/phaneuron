[package]
name = "tinyvoxel"
version = "0.1.0"
edition = "2021"
description = "A tiny, moddable, procedurally generated voxel world"

[dependencies]
wgpu = "=22.1.0"
winit = "0.30"
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.29", features = ["bytemuck"] }
image = { version = "0.25", default-features = false, features = ["png"] }
gltf = { version = "1.4", default-features = false, features = ["import", "utils"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"

[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
