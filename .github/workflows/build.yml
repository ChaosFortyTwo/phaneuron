name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, name: linux-x86_64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x86_64 }
          - { os: macos-latest, target: aarch64-apple-darwin, name: macos-apple-silicon }
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          out=dist/${{ matrix.name }}
          mkdir -p "$out"
          exe=phaneuron; [ "${{ matrix.os }}" = "windows-latest" ] && exe=phaneuron.exe
          cp "target/${{ matrix.target }}/release/$exe" "$out/"
          cp -r assets "$out/assets"
          mkdir -p "$out/mods" "$out/saves"
          cp -r examples "$out/examples"
          cp -r docs "$out/docs"
          cp README.md "$out/"
      - uses: actions/upload-artifact@v4
        with:
          name: phaneuron-${{ matrix.name }}
          path: dist/${{ matrix.name }}
