# Phaneuron settings. Every line is optional: delete any of them and the default is used.
# Colors are "#rrggbb". Mods can ship their own config.toml to replace this file.
# Each world has its own seed, chosen on the New World screen.

[window]
title = "Phaneuron"
width = 1280
height = 720

[render]
render_distance = 12  # default view distance in chunks (a chunk is 16 blocks = 8 world units); Settings can raise it to 32
tile_size = 32        # every texture is resampled to tile_size x tile_size
ui_scale = 0.0        # 0 = automatic (follows the window height); or 1.0, 2.0, 3.0 ...
fov = 75.0

[world]
# Lengths below are in blocks. A block is half a world unit, so these numbers
# are double what they would be if blocks were 1 unit wide.
base_height = 60.0    # average ground level
amplitude = 32.0      # how tall the hills get
frequency = 0.006     # smaller = broader hills
octaves = 4           # more = more small-scale bumps
surface = "grass"     # block ids = file names in blocks/ without .toml
subsurface = "dirt"
subsurface_depth = 6
deep = "stone"

[sky]
top = "#4f8fe0"
horizon = "#bfddf2"
# fog_color = "#bfddf2"   # defaults to the horizon color
fog_start = 0.55          # fractions of the view distance
fog_end = 0.95

[player]
# Distances here are in world units. The hitbox is 2.0 units (4 blocks) tall, 1.0 (2 blocks) while sneaking.
walk_speed = 4.5
sprint_multiplier = 1.7
sneak_multiplier = 0.35   # walking speed while sneaking (C)
fly_speed = 10.0          # /switch free-flying speed
jump_height = 1.25
gravity = 28.0
mouse_sensitivity = 0.0022   # can also be changed in Settings
eye_height = 1.8
reach = 5.0               # how far you can break/place blocks

# Render distance, mouse speed, field of view and key bindings are set in the game's
# Settings screen and saved to settings.toml next to the game; they override the values above.
